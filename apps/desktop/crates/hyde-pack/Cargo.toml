[package]
name = "hyde-pack"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Offline TOML compiler for Hyde AI language packs"

[dependencies]
hyde-core = { path = "../hyde-core" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }

[[bin]]
name = "hyde-pack"
path = "src/main.rs"
